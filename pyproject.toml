[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-enclave-tool-proxy"
version = "0.1.0"
description = "Isolated tool proxy segregating high-privilege credentials and signing keys from untrusted model contexts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
secure-enclave-tool-proxy = "secure_enclave_tool_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secure_enclave_tool_proxy*"]
